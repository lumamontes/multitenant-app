# Auto-generated orchestrator workflow
# Generated at: 2025-06-01T08:45:49.702Z
# This workflow triggers individual tenant builds

name: Build All Tenants

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tenants:
        description: 'Comma-separated list of tenants (leave empty for all)'
        required: false
        type: string
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'Build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: 🔍 Discover Tenants
    runs-on: ubuntu-latest
    outputs:
      tenants: ${{ steps.get-tenants.outputs.tenants }}
      profile: ${{ steps.set-profile.outputs.profile }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔍 Get tenant list
        id: get-tenants
        run: |
          if [ "${{ inputs.tenants }}" != "" ]; then
            TENANTS_INPUT="${{ inputs.tenants }}"
            TENANTS_ARRAY=$(echo $TENANTS_INPUT | tr ',' '\n' | jq -R . | jq -s . | tr -d '\n')
            echo "tenants=$TENANTS_ARRAY" >> $GITHUB_OUTPUT
          else
            if [ -d "config/tenants" ] && [ "$(ls -A config/tenants/*.json 2>/dev/null)" ]; then
              TENANTS=$(ls config/tenants/*.json | xargs -I {} basename {} .json | jq -R . | jq -s . | tr -d '\n')
              echo "tenants=$TENANTS" >> $GITHUB_OUTPUT
            else
              echo "tenants=[]" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 📝 Set profile
        id: set-profile
        run: |
          if [[ $GITHUB_EVENT_NAME == "pull_request" ]]; then
            echo "profile=preview" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_EVENT_NAME == "release" ]]; then
            echo "profile=production" >> $GITHUB_OUTPUT
          else
            echo "profile=${{ inputs.profile || 'production' }}" >> $GITHUB_OUTPUT
          fi

  build-tenants:
    name: 🏗️ Build ${{ matrix.tenant }}
    needs: [discover]
    if: ${{ fromJson(needs.discover.outputs.tenants)[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tenant: ${{ fromJson(needs.discover.outputs.tenants) }}
        platform: ${{ inputs.platform == 'all' && fromJson('["ios", "android"]') || fromJson(format('["{0}"]', inputs.platform || 'all')) }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📱 Generate tenant config
        run: npm run config:generate
        env:
          TENANT: ${{ matrix.tenant }}

      - name: 🏗️ Build ${{ matrix.tenant }} for ${{ matrix.platform }}
        run: |
          echo "Building ${{ matrix.tenant }} for ${{ matrix.platform }} with profile ${{ needs.discover.outputs.profile }}"
          # Add your actual build commands here
          # eas build --platform ${{ matrix.platform }} --profile ${{ matrix.tenant }}-${{ needs.discover.outputs.profile }} --non-interactive
        env:
          TENANT: ${{ matrix.tenant }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  summary:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: [discover, build-tenants]
    if: always()
    steps:
      - name: 📊 Print summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Tenants built:** ${{ join(fromJson(needs.discover.outputs.tenants), ', ') }}" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ needs.discover.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ inputs.platform || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results:" >> $GITHUB_STEP_SUMMARY
          echo "- Build job: ${{ needs.build-tenants.result }}" >> $GITHUB_STEP_SUMMARY

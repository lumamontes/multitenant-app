# .github/workflows/pr-validation.yml
name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Run linters
        run: |
          npm run lint
          npm run typecheck

      - name: 🏗️ Validate tenant configs
        run: npm run tenant:validate

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm run test-ci

  preview-build:
    name: 📱 Preview Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        tenant: ['tenant1'] # Only build one tenant for PR preview
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📱 Generate tenant config
        run: npm run config:generate
        env:
          EXPO_PUBLIC_TENANT: ${{ matrix.tenant }}

      - name: 🏗️ EAS Build Preview
        run: |
          eas build \
            --platform all \
            --profile ${{ matrix.tenant }}-preview \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_TENANT: ${{ matrix.tenant }}
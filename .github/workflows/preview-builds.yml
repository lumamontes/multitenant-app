# .github/workflows/preview-builds.yml
name: Preview Builds

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      tenant:
        description: 'Tenant to build preview for'
        required: true
        type: string

jobs:
  preview:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Build preview for first tenant only (or specified tenant)
        tenant: ${{ github.event.inputs.tenant && fromJson(format('["{0}"]', github.event.inputs.tenant)) || fromJson('["tenant1"]') }}
    
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Verify tenant exists
        run: |
          TENANT_FILE="./config/tenants/${{ matrix.tenant }}.json"
          if [ ! -f "$TENANT_FILE" ]; then
            echo "❌ Tenant not found: ${{ matrix.tenant }}"
            echo "📁 Available tenants:"
            ls -1 ./config/tenants/*.json | xargs -I {} basename {} .json
            exit 1
          fi
          
          echo "📱 Building preview for: ${{ matrix.tenant }}"
          node -e "
            const tenant = require('$TENANT_FILE');
            console.log('   Name:', tenant.name);
            console.log('   Bundle ID:', tenant.bundleIdentifier);
          "

      - name: 🔧 Generate configurations
        run: npm run config:generate
        env:
          EXPO_PUBLIC_TENANT: ${{ matrix.tenant }}

      - name: 🏗 Build preview
        run: |
          eas build \
            --profile "${{ matrix.tenant }}-preview" \
            --platform all \
            --non-interactive
        env:
          EXPO_PUBLIC_TENANT: ${{ matrix.tenant }}

      - name: 💬 Comment QR code
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const tenant = '${{ matrix.tenant }}';
            const projectId = process.env.EXPO_PROJECT_ID;
            
            if (!projectId) {
              console.log('No EXPO_PROJECT_ID found, skipping QR comment');
              return;
            }
            
            // This is a placeholder - you'd need to get the actual build ID
            const qrUrl = `https://qr.expo.dev/eas-update?projectId=${projectId}`;
            
            const comment = `
            ## 📱 Preview Build Ready for ${tenant}
            
            ![QR Code](${qrUrl})
            
            **Tenant**: ${tenant}
            **Platform**: All
            **Profile**: ${tenant}-preview
            
            Scan the QR code with Expo Go to test the build.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      - name: 📦 Install dependencies
        run: npm ci

      - name: 📱 Generate tenant config
        run: npm run config:generate
        env:
          EXPO_PUBLIC_TENANT: tenant2

      - name: 📷 Check fingerprint
        id: fingerprint
        run: |
          # Check if native code changed using expo fingerprint
          if npx @expo/fingerprint@latest --platform all --json > current-fingerprint.json; then
            # Compare with cached fingerprint
            if [ -f "fingerprint-cache-tenant2.json" ]; then
              if ! cmp -s current-fingerprint.json fingerprint-cache-tenant2.json; then
                echo "includes-changes=true" >> $GITHUB_OUTPUT
                echo "🔄 Native changes detected for tenant2"
              else
                echo "includes-changes=false" >> $GITHUB_OUTPUT
                echo "✅ No native changes for tenant2"
              fi
            else
              echo "includes-changes=true" >> $GITHUB_OUTPUT
              echo "🆕 First build for tenant2"
            fi
            cp current-fingerprint.json fingerprint-cache-tenant2.json
          else
            echo "includes-changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Cache fingerprint
        uses: actions/cache@v4
        with:
          path: fingerprint-cache-tenant2.json
          key: fingerprint-tenant2-${{ github.sha }}
          restore-keys: |
            fingerprint-tenant2-


jobs:
  # Check fingerprint to decide between OTA update or new build
  fingerprint:
    name: 📷 Check Fingerprint
    runs-on: ubuntu-latest
    outputs:
      needs-build: ${{ steps.fingerprint.outputs.includes-changes }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:

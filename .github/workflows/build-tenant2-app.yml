      - name: 📤 Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenant2-ios-${{ inputs.profile || 'production' }}
          path: build-tenant2-ios.ipa
          retention-days: 30

      - name: 🚀 Submit to App Store
